<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Barisal — Admin Panel</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --sidebar: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #0a0e14;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: 100vh;
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 15px;
      color: var(--accent);
    }

    .sidebar-header .ver {
      font-size: 10px;
      color: var(--text-dim);
    }

    .cat {
      border-bottom: 1px solid #1c2333;
    }

    .cat-header {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      gap: 6px;
      user-select: none;
      color: var(--text-dim);
    }

    .cat-header:hover {
      color: var(--text);
      background: #161b22;
    }

    .cat-header .arrow {
      margin-left: auto;
      font-size: 9px;
      transition: transform 0.2s;
    }

    .cat-header.open .arrow {
      transform: rotate(90deg);
    }

    .cat-body {
      display: none;
    }

    .cat-body.open {
      display: block;
    }

    .ep-item {
      display: flex;
      align-items: center;
      padding: 5px 14px 5px 24px;
      cursor: pointer;
      font-size: 11px;
      gap: 6px;
      border-left: 2px solid transparent;
      color: var(--text-dim);
    }

    .ep-item:hover {
      background: #161b22;
      border-left-color: var(--accent);
      color: var(--text);
    }

    .ep-item .method {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      min-width: 30px;
      text-align: center;
    }

    .method.get {
      background: #1f6feb22;
      color: #58a6ff;
    }

    .method.post {
      background: #3fb95022;
      color: #3fb950;
    }

    .method.ws {
      background: #d2992222;
      color: #d29922;
    }

    .ep-item .path {
      font-family: 'Consolas', monospace;
      font-size: 10px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .topbar label {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .topbar input[type="text"] {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      flex: 1;
      min-width: 180px;
    }

    .topbar button {
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-org {
      background: var(--orange);
      color: #000;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }

    .info-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .info-chip {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 10px;
    }

    .info-chip .lbl {
      color: var(--text-dim);
    }

    .info-chip .val {
      color: var(--accent);
      font-weight: 600;
    }

    .test-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      display: none;
    }

    .test-area.active {
      display: block;
    }

    .test-header {
      background: #1c2333;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .test-body {
      padding: 10px 14px;
    }

    .test-body textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      min-height: 60px;
      resize: vertical;
      margin-bottom: 6px;
    }

    .test-body .actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .test-body .actions button {
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      border: none;
    }

    .test-body .actions .send {
      background: var(--green);
      color: #000;
    }

    .test-body .actions .save-btn {
      background: var(--accent);
      color: #000;
    }

    .test-body .actions .cancel {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .test-body .actions .ep-label {
      font-family: monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .response-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .response-header {
      background: #1c2333;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .response-meta {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .response-body {
      padding: 10px 14px;
      max-height: 300px;
      overflow: auto;
    }

    .response-body pre {
      font-family: 'Consolas', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }

    .empty-state {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      padding: 24px;
    }

    .status-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
    }

    .s2xx {
      background: #3fb95033;
      color: #3fb950;
    }

    .s4xx {
      background: #d2992233;
      color: #d29922;
    }

    .s5xx {
      background: #f8514933;
      color: #f85149;
    }

    .serr {
      background: #f8514933;
      color: #f85149;
    }

    .reports-panel {
      position: fixed;
      right: -360px;
      top: 0;
      width: 360px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.25s;
      display: flex;
      flex-direction: column;
    }

    .reports-panel.open {
      right: 0;
    }

    .reports-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reports-header h3 {
      font-size: 13px;
    }

    .reports-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .report-item {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .report-item:hover {
      border-color: var(--accent);
    }

    .report-item .rpath {
      font-family: monospace;
      color: var(--accent);
    }

    .report-item .rtime {
      color: var(--text-dim);
      font-size: 9px;
    }

    .report-item .rdate {
      color: var(--text-dim);
      font-size: 9px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--green);
      color: #000;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      z-index: 999;
      display: none;
      animation: fadeIn 0.2s;
    }

    .toast.error {
      background: var(--red);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>☠️ Mission Barisal</h1>
      <div class="ver">Admin Panel · v3</div>
    </div>
    <div id="sidebarCategories"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <label>🔗 URL:</label>
      <input type="text" id="baseUrl" value="" placeholder="Auto-detected from browser">
      <button class="btn-primary" onclick="fetchServerInfo()">🔍 Fetch</button>
      <button class="btn-ghost" onclick="toggleReports()">📋 Reports <span id="reportCount"
          style="color:var(--orange)">0</span></button>
      <button class="btn-org" onclick="clearResponse()">🗑️ Clear</button>
    </div>
    <div class="content">
      <div class="info-bar" id="infoBar"></div>
      <div class="test-area" id="testArea">
        <div class="test-header" id="testHeader">Select an endpoint from sidebar</div>
        <div class="test-body" id="testBody"></div>
      </div>
      <div class="response-area">
        <div class="response-header"><span>📡 Response</span><span class="response-meta" id="responseMeta"></span></div>
        <div class="response-body" id="responseBody">
          <div class="empty-state">Select an endpoint from the sidebar to test.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="closeReports()"></div>
  <div class="reports-panel" id="reportsPanel">
    <div class="reports-header">
      <h3>📋 Saved Reports</h3>
      <div>
        <button class="btn-ghost" style="padding:2px 8px;font-size:10px" onclick="exportReports()">📥</button>
        <button class="btn-org" style="padding:2px 8px;font-size:10px" onclick="clearReports()">🗑️</button>
        <button style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px"
          onclick="closeReports()">✕</button>
      </div>
    </div>
    <div class="reports-list" id="reportsList"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const C = [
      {
        n: "🏠 Dashboard", items: [
          { m: "GET", p: "/health", d: "Server health" },
          { m: "GET", p: "/identity", d: "Server identity" },
          { m: "GET", p: "/api/config/origin", d: "Origin config" },
          { m: "GET", p: "/status", d: "Status overview" },
          { m: "GET", p: "/api/rate-limit", d: "Rate limits" },
        ]
      },
      {
        n: "💬 Chat", items: [
          { m: "POST", p: "/v1/chat/completions", d: "Chat completion", b: () => JSON.stringify({ model: "mission", messages: [{ role: "user", content: "Hello" }], stream: true }, null, 2) },
          { m: "GET", p: "/v1/models", d: "Models list" },
          { m: "GET", p: "/api/v0/models", d: "Models (v0)" },
          { m: "GET", p: "/api/v1/models", d: "Models (v1)" },
        ]
      },
      {
        n: "🔌 MCP", items: [
          { m: "GET", p: "/api/config/mcp", d: "MCP config" },
          { m: "GET", p: "/api/mcp-clients", d: "MCP clients" },
          { m: "GET", p: "/api/admin/mcp-connections", d: "MCP connections" },
          { m: "POST", p: "/mcp", d: "MCP JSON-RPC", b: () => JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/list" }, null, 2) },
          { m: "POST", p: "/api/mission", d: "6-agent mission", b: () => JSON.stringify({ input: "Write hello world" }, null, 2) },
          { m: "POST", p: "/api/v1/anti-dote", d: "Anti-Dote check", b: () => JSON.stringify({ input: "Test", session_id: "" }, null, 2) },
          { m: "POST", p: "/api/connect", d: "Handshake", b: () => JSON.stringify({ action: "handshake", client: "admin" }, null, 2) },
        ]
      },
      {
        n: "📁 Files", items: [
          { m: "POST", p: "/api/connect", d: "Read file", b: () => JSON.stringify({ action: "read_file", path: "api.js" }, null, 2) },
          { m: "POST", p: "/api/connect", d: "Write file", b: () => JSON.stringify({ action: "write_file", path: "test.txt", content: "Hello" }, null, 2) },
          { m: "POST", p: "/api/connect", d: "List dir", b: () => JSON.stringify({ action: "list_dir", path: "." }, null, 2) },
          { m: "POST", p: "/api/connect", d: "Info", b: () => JSON.stringify({ action: "info" }, null, 2) },
          { m: "GET", p: "/api/ssot", d: "SSOT" },
          { m: "GET", p: "/api/syllabus", d: "Syllabus" },
          { m: "GET", p: "/api/memory", d: "Memory" },
        ]
      },
      {
        n: "🤖 Agents", items: [
          { m: "POST", p: "/api/connect", d: "Run mission", b: () => JSON.stringify({ action: "mission", input: "Write a Python script" }, null, 2) },
          { m: "POST", p: "/api/connect", d: "Single agent", b: () => JSON.stringify({ action: "agent", agent_id: "code-guru", input: "Review this" }, null, 2) },
          { m: "GET", p: "/api/agents", d: "Agent list" },
          { m: "GET", p: "/api/admin/agents-status", d: "Agents status" },
        ]
      },
      {
        n: "🔐 Session", items: [
          { m: "GET", p: "/api/verify-session", d: "Verify session", q: true, qk: "session_id", ql: "Session ID:" },
          { m: "GET", p: "/api/sessions", d: "All sessions" },
          { m: "GET", p: "/api/clients", d: "All clients" },
          { m: "GET", p: "/api/sessions/search", d: "Search sessions", q: true, qk: "q", ql: "Keyword:" },
          { m: "GET", p: "/api/pusher-config", d: "Pusher config" },
        ]
      },
      {
        n: "⚙️ Config", items: [
          { m: "GET", p: "/api/config", d: "Runtime config" },
          { m: "POST", p: "/api/config", d: "Update config", b: () => JSON.stringify({ logLevel: "DEBUG" }, null, 2) },
          { m: "GET", p: "/api/domain", d: "Domain config" },
          { m: "GET", p: "/api/normalize-list", d: "Normalizer info" },
          { m: "POST", p: "/api/normalize", d: "Test normalizer", b: () => JSON.stringify({ model: "deepseek-v4-flash-free", provider: "opencode" }, null, 2) },
          { m: "POST", p: "/api/rate-limit/reset", d: "Reset limits", b: () => '{}' },
        ]
      },
      {
        n: "📊 Admin", items: [
          { m: "GET", p: "/api/admin/stats", d: "Server stats" },
          { m: "GET", p: "/api/locks", d: "Lock status" },
          { m: "GET", p: "/api/admin/ssot-status", d: "SSOT status" },
          { m: "GET", p: "/api/admin/rate-limits", d: "Rate limits admin" },
          { m: "POST", p: "/api/set-working-dir", d: "Set working dir", b: () => JSON.stringify({ directory: "." }, null, 2) },
          { m: "POST", p: "/api/workspace", d: "Register workspace", b: () => JSON.stringify({ path: "." }, null, 2) },
          { m: "POST", p: "/api/input", d: "Unified input", b: () => JSON.stringify({ input: "Hello", mode: "chat" }, null, 2) },
        ]
      },
      {
        n: "🌐 WS/SSE", items: [
          { m: "WS", p: "ws://localhost:5000", d: "WebSocket" },
          { m: "POST", p: "/api/connect", d: "Connect via API", b: () => JSON.stringify({ action: "handshake" }, null, 2) },
          { m: "GET", p: "/api/config/origin", d: "Origin config" },
        ]
      },
    ];
    function renderSidebar() {
      const s = document.getElementById("sidebarCategories");
      C.forEach((cat, ci) => {
        const w = document.createElement("div"); w.className = "cat";
        const h = document.createElement("div"); h.className = "cat-header";
        const b = document.createElement("div"); b.className = "cat-body";
        h.innerHTML = cat.n + ` <span class="arrow">▶</span>`;
        h.onclick = () => { h.classList.toggle("open"); b.classList.toggle("open"); };
        cat.items.forEach((it, ii) => {
          const e = document.createElement("div"); e.className = "ep-item";
          e.innerHTML = `<span class="method ${it.m.toLowerCase()}">${it.m}</span><span class="path">${it.p}</span>`;
          e.onclick = () => openEndpoint(ci, ii); b.appendChild(e);
        });
        w.appendChild(h); w.appendChild(b); s.appendChild(w);
      });
      const f = s.querySelector(".cat-header"); if (f) { f.classList.add("open"); f.nextElementSibling.classList.add("open"); }
    }
    let cur = null;
    function openEndpoint(ci, ii) {
      const ep = C[ci].items[ii]; cur = ep;
      const area = document.getElementById("testArea"), head = document.getElementById("testHeader"), body = document.getElementById("testBody");
      area.classList.add("active");
      const mc = ep.m === "GET" ? "#58a6ff" : ep.m === "POST" ? "#3fb950" : "#d29922", mb = ep.m === "GET" ? "#1f6feb33" : ep.m === "POST" ? "#3fb95033" : "#d2992233";
      head.innerHTML = `<span style="background:${mb};color:${mc};padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700">${ep.m}</span> ${ep.p} <span style="color:var(--text-dim);font-weight:400;font-size:11px">— ${ep.d}</span>`;
      let h = "";
      if (ep.q) h += `<div style="margin-bottom:6px;display:flex;align-items:center;gap:6px"><label style="font-size:11px;color:var(--text-dim)">${ep.ql || "Value:"}</label><input type="text" id="qParam" value="test" style="background:#0d1117;border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px;width:160px"></div>`;
      if (ep.b) h += `<textarea id="reqBody">${typeof ep.b === "function" ? ep.b() : ep.b}</textarea>`;
      h += `<div class="actions"><button class="send" onclick="sendReq()">🚀 Send</button><button class="save-btn" onclick="saveReport()">💾 Save</button><button class="cancel" onclick="closeTest()">✕ Close</button><span class="ep-label">${ep.m} ${ep.p}</span></div>`;
      body.innerHTML = h; area.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function closeTest() { document.getElementById("testArea").classList.remove("active"); cur = null; }
    async function sendReq() {
      if (!cur) return; const ep = cur; const base = document.getElementById("baseUrl").value.replace(/\/+$/, "");
      let url = base + ep.p; if (ep.q) url = base + ep.p + "?" + ep.qk + "=" + encodeURIComponent(document.getElementById("qParam")?.value || "test");
      showLoading(); const t = performance.now();
      try {
        const hd = { "Accept": "application/json" }; let bd = null;
        if (ep.m === "POST") { hd["Content-Type"] = "application/json"; const ta = document.getElementById("reqBody"); if (ta) bd = ta.value; }
        const r = await fetch(url, { method: ep.m, headers: hd, body: bd });
        const el = Math.round(performance.now() - t); const rb = await r.text();
        let f = rb; try { f = JSON.stringify(JSON.parse(rb), null, 2); } catch (e) { }
        showResp(r.status, el, f, url);
      } catch (e) { showResp("ERR", Math.round(performance.now() - t), `Error: ${e.message}`, url); }
    }
    function showLoading() { document.getElementById("responseBody").innerHTML = '<div style="text-align:center;padding:16px"><div class="spinner"></div><br><span style="color:var(--text-dim);font-size:12px">Requesting...</span></div>'; document.getElementById("responseMeta").textContent = ""; }
    function showResp(st, el, body, url) {
      const m = document.getElementById("responseMeta"), b = document.getElementById("responseBody");
      let c = "serr"; if (typeof st === "number") { if (st < 300) c = "s2xx"; else if (st < 500) c = "s4xx"; else c = "s5xx"; }
      m.innerHTML = `<span class="status-badge ${c}">${st}</span> ${el}ms · <span style="font-family:monospace;font-size:10px">${url}</span>`;
      b.innerHTML = `<pre>${esc(body)}</pre>`;
    }
    function saveReport() {
      const body = document.getElementById("responseBody").querySelector("pre"), meta = document.getElementById("responseMeta");
      if (!body || !meta) return toast("No response to save!", "error");
      const r = { id: Date.now().toString(36), method: cur?.m || "?", path: cur?.p || "?", status: meta.textContent.split(" ")[0] || "?", elapsed: meta.textContent.match(/\d+ms/)?.[0] || "?", time: new Date().toISOString(), body: body.textContent };
      const rs = JSON.parse(localStorage.getItem("reports") || "[]"); rs.unshift(r); localStorage.setItem("reports", JSON.stringify(rs));
      updCount(); toast("✅ Report saved!");
    }
    function updCount() { document.getElementById("reportCount").textContent = (JSON.parse(localStorage.getItem("reports") || "[]")).length; }
    function toggleReports() { const p = document.getElementById("reportsPanel"), o = document.getElementById("overlay"); p.classList.toggle("open"); o.classList.toggle("show"); if (p.classList.contains("open")) renderReports(); }
    function closeReports() { document.getElementById("reportsPanel").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }
    function renderReports() {
      const l = document.getElementById("reportsList"), rs = JSON.parse(localStorage.getItem("reports") || "[]");
      if (!rs.length) { l.innerHTML = '<div class="empty-state" style="padding:20px">No saved reports.</div>'; return; }
      l.innerHTML = "";
      rs.forEach((r, i) => {
        const d = new Date(r.time);
        const dv = document.createElement("div"); dv.className = "report-item";
        dv.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span><span class="status-badge s2xx" style="font-size:9px">${r.status}</span> <span class="rpath">${r.method} ${r.path}</span></span><span class="rdate">${d.toLocaleString()}</span></div><div style="display:flex;justify-content:space-between"><span class="rtime">⏱ ${r.elapsed}</span><div><button class="btn-ghost" style="padding:1px 5px;font-size:9px" onclick="loadReport(${i})">📄</button><button class="btn-ghost" style="padding:1px 5px;font-size:9px;color:var(--red)" onclick="delReport(${i})">🗑️</button></div></div>`;
        l.appendChild(dv);
      });
    }
    function loadReport(i) { const rs = JSON.parse(localStorage.getItem("reports") || "[]"), r = rs[i]; if (!r) return; closeReports(); document.getElementById("responseMeta").innerHTML = `<span class="status-badge s2xx">${r.status}</span> ${r.elapsed} · <span style="font-family:monospace;font-size:10px">${r.method} ${r.path}</span> <span style="color:var(--text-dim)">📁 ${new Date(r.time).toLocaleString()}</span>`; document.getElementById("responseBody").innerHTML = `<pre>${r.body}</pre>`; }
    function delReport(i) { const rs = JSON.parse(localStorage.getItem("reports") || "[]"); rs.splice(i, 1); localStorage.setItem("reports", JSON.stringify(rs)); renderReports(); updCount(); }
    function clearReports() { if (!confirm("Clear all reports?")) return; localStorage.removeItem("reports"); renderReports(); updCount(); toast("Reports cleared"); }
    function exportReports() { const d = localStorage.getItem("reports") || "[]"; const b = new Blob([JSON.stringify(JSON.parse(d), null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "reports.json"; a.click(); toast("Exported!"); }
    async function fetchServerInfo() { const base = document.getElementById("baseUrl").value.replace(/\/+$/, ""); const bar = document.getElementById("infoBar"); try { const [id, hl, dom] = await Promise.all([fetch(base + "/identity").then(r => r.json()).catch(() => ({})), fetch(base + "/health").then(r => r.json()).catch(() => ({})), fetch(base + "/api/domain").then(r => r.json()).catch(() => ({}))]); bar.innerHTML = `<div class="info-chip"><span class="lbl">Server: </span><span class="val">${id.name || id.server || "—"}</span></div><div class="info-chip"><span class="lbl">Domain: </span><span class="val">${dom.domain || id.domain || "—"}</span></div><div class="info-chip"><span class="lbl">Type: </span><span class="val">${dom.serverType || id.serverType || "—"}</span></div><div class="info-chip"><span class="lbl">Version: </span><span class="val">${id.version || dom.version || "—"}</span></div><div class="info-chip"><span class="lbl">Status: </span><span class="val">${hl.status || "—"}</span></div><div class="info-chip"><span class="lbl">Uptime: </span><span class="val">${hl.uptime ? hl.uptime + "s" : "—"}</span></div>`; } catch (e) { bar.innerHTML = `<div class="info-chip"><span class="lbl">Error: </span><span class="val" style="color:var(--red)">${e.message}</span></div>`; } }
    function clearResponse() { document.getElementById("responseBody").innerHTML = '<div class="empty-state">Cleared.</div>'; document.getElementById("responseMeta").textContent = ""; }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function toast(msg, t) { const el = document.getElementById("toast"); el.textContent = msg; el.className = "toast" + (t === "error" ? " error" : ""); el.style.display = "block"; setTimeout(() => el.style.display = "none", 2500); }
    document.addEventListener("DOMContentLoaded", () => { renderSidebar(); updCount(); document.getElementById("baseUrl").value = window.location.origin; fetchServerInfo(); const su = localStorage.getItem("url"); if (su) document.getElementById("baseUrl").value = su; document.getElementById("baseUrl").onchange = () => localStorage.setItem("url", document.getElementById("baseUrl").value); });
  </script>
</body>

</html>
